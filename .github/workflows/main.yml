name: Weekly Dashboard Update

on:
  schedule:
    - cron: '0 7 * * 4'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 获取代码仓库
      uses: actions/checkout@v3

    - name: 配置 Python 环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 【这里是修复报错的关键步骤：让机器人提前安装好工具】
    - name: 安装爬虫依赖包
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: 运行爬虫与生成器
      run: python main.py

    - name: 提交并推送生成的 index.html
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add index.html
        git commit -m "Auto-update CDC data" || echo "No changes to commit"
        git push
